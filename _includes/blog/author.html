<section class="author" aria-label="작성자">
  <img class="author__avatar" src="{{ site.author.avatar | relative_url }}" alt="" width="72" height="72">
  <div class="author__body">
    <p class="author__name">{{ site.author.name }}</p>
    {%- if site.author.bio %}
    <p class="author__bio">{{ site.author.bio }}</p>
    {%- endif %}
    <ul class="author__links">
      {%- for link in site.author.links %}
        {%- if link.url %}
      <li><a href="{{ link.url }}"{% unless link.url contains 'mailto:' %} rel="me"{% endunless %}>{{ link.label }}</a></li>
        {%- endif %}
      {%- endfor %}
    </ul>
  </div>
</section>
