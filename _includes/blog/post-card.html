{%- assign card_post = include.post -%}
<a class="card" href="{{ card_post.url | relative_url }}">
  <span class="card__thumb">
    {%- include blog/post-thumb.html post=card_post sizes="(max-width: 755px) calc(100vw - 40px), (max-width: 768px) 715px, 346px" -%}
  </span>
  <span class="card__title">{{ card_post.title | markdownify | strip_html | strip }}</span>
  <time class="card__date" datetime="{{ card_post.date | date_to_xmlschema }}">{{ card_post.date | date: site.date_format }}</time>
</a>
