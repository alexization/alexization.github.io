# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
locale                   : "ko-KR"
title                   : "효석의 기술 블로그"
title_separator          : "-"
subtitle                 : "내 기억력을 믿지 않는다. 꾸준히 기록하자."
name                     : "백효석"
alternate_name           : "alexization.github.io"
description              : "백엔드, 데이터베이스, 인프라를 중심으로 Spring Boot, JPA, MySQL, Redis, 홈랩 운영 경험을 기록하는 효석의 기술 블로그입니다."
url                      : "https://alexization.github.io"
baseurl                  : # the subpath of your site, e.g. "/blog"
repository               : "alexization/alexization.github.io"  # GitHub username/repo-name e.g. "mmistakes/minimal-mistakes"
teaser                   : "/assets/images/author.png" # path of fallback teaser image, e.g. "/assets/images/500x300.png"
logo                     : "/assets/images/logo.png" # path of logo image to display in the masthead, e.g. "/assets/images/88x88.png"
words_per_minute         : 200
date_format              : "%Y.%m.%d"
copyright               : # "copyright" name, defaults to site.title
copyright_url            : # "copyright" URL, defaults to site.url
comments:
  provider               : "giscus" # false (default), "disqus", "discourse", "facebook", "staticman", "staticman_v2", "utterances", "giscus", "custom"
  giscus:
    data-repo: "alexization/alexization.github.io"
    repo_id: "R_kgDOPZzCig"
    category_name: "Announcements"
    category_id: "DIC_kwDOPZzCis4Ct4yS"
    discussion_term: "pathname"
    strict: "0"
    reactions_enabled: "1"
    emit_metadata: "0"
    input_position: "bottom"
    theme: "light"
    lang: "ko"
    crossorigin: "anonymous"
atom_feed:
  path                   : # blank (default) uses feed.xml
  hide                   : # true, false (default)
search_full_content      : # true, false (default)
lunr:
  search_within_pages    : # true, false (default)
# SEO Related
google_site_verification :
bing_site_verification   :
naver_site_verification  :
yandex_site_verification :
baidu_site_verification  :

# Social Sharing
twitter:
  username               :
facebook:
  app_id                 :
  publisher              :
og_image                 : "/assets/images/author.png" # Open Graph/Twitter default site image
og_image_alt             : "효석의 기술 블로그 대표 이미지"
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  name                  : "백효석"
  links: # An array of links to social media profiles
    - "https://github.com/alexization"

# Analytics
analytics:
  provider               : "google-gtag"  # false (default), "google", "google-universal", "google-gtag", "custom"
  google:
    tracking_id          : "G-10V81WVWWM"
    anonymize_ip         : # true, false (default)


# Site Author
author:
  name             : "백효석"
  home             : "/about/"
  avatar           : "/assets/images/author.png"  # path of avatar image, e.g. "/assets/images/bio-photo.jpg"
  bio              : "내 기억력을 믿지 않는다. 꾸준히 기록하자." # "I am an **amazing** person."
  location         : "Seoul, Korea"
  email            : # "alexization@gmail.com"
  links:
    - label: "GitHub"
      url: "https://github.com/alexization"
    - label: "Email"
      url: "mailto:alexization@gmail.com"
# Site Footer
footer:
  links:
    - label: "Twitter"
      # url:
    - label: "Facebook"
      # url:
    - label: "GitHub"
      url: "https://github.com/alexization"
    - label: "GitLab"
      # url:
    - label: "Bitbucket"
      # url:
    - label: "Instagram"
      # url:
  since: "2025"


# Reading Files
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - minimal-mistakes-jekyll.gemspec
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - tmp
  - /docs # ignore Minimal Mistakes /docs
  - /test # ignore Minimal Mistakes /test
  - PRODUCT.md
  - DESIGN.md
  - docs/redesign
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # https://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style
  quiet_deps: true
  sourcemap: never


# Outputting
permalink: /:categories/:title/
timezone: Asia/Seoul # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones


redirect_from:
  json: false


# Plugins (previously gems:)
plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# mimic GitHub Pages with --safe
whitelist:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache


# Archives
category_archive:
  path: /categories/
tag_archive:
  path: /tags/


# Defaults
defaults:
  - scope:
      path: "google167226cfabb37bdd.html"
    values:
      sitemap: false
  - scope:
      path: "page*"
    values:
      sitemap: false
  - scope:
      path: "page*/index.html"
    values:
      sitemap: false
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
      show_date: true
